# CI: on every pull request and every push to main, for each service run ruff and pytest,
# validate every manifest under k8s/ against the Kubernetes v1.37 schema, and build each
# service's image. Every job runs on every PR, so each can be a required check on main
# (a job skipped by a path filter would block a PR instead of passing it).
#
# Actions are pinned by commit SHA (the tag is a comment), so a moved tag can't change what
# runs here. Dependabot (.github/dependabot.yml) proposes the bumps.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    name: ${{ matrix.service }} lint and tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [status, prober]   # add each new service here
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest

  manifests:
    name: manifests validate against Kubernetes v1.37
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # kubeconform checks each manifest against the API's JSON schema for that version.
      # -strict makes an unknown field an error, the way `kubectl apply` would reject it.
      - run: >
          docker run --rm -v "$PWD/k8s:/k8s:ro"
          ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
          -strict -kubernetes-version 1.37.0 -summary -verbose /k8s

  image:
    name: ${{ matrix.service }} image builds
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [status, prober]   # add each new service here
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t ${{ matrix.service }}:ci services/${{ matrix.service }}
