# Weekly PRs for dependency updates: each service's pinned Python packages and base image,
# and the Actions used by the workflows (which are pinned by commit SHA).
# Add a pip and a docker entry for each new service.
version: 2
updates:
  - package-ecosystem: pip
    directory: /services/status
    schedule:
      interval: weekly
    labels: [dependencies]
  - package-ecosystem: docker
    directory: /services/status
    schedule:
      interval: weekly
    labels: [dependencies]
    ignore:
      # A new Python line is a decision, not a bump (#11 proposed 3.12 → 3.15). Patches only.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: pip
    directory: /services/prober
    schedule:
      interval: weekly
    labels: [dependencies]
  - package-ecosystem: docker
    directory: /services/prober
    schedule:
      interval: weekly
    labels: [dependencies]
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
